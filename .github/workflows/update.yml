name: 每日要闻

on:
  schedule:
    # GitHub 的定时器走 UTC；北京时间 08:00 = UTC 00:00
    - cron: "0 0 * * *"
  workflow_dispatch: # 手动点一下就能立刻测试

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取 RSS 并推送（PushPlus / Bark / Telegram）
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python fetch_news.py --push

      - name: 把新的 news.json 提交回仓库
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json
          git diff --cached --quiet || git commit -m "chore: 更新要闻 $(date -u +%F)"
          git push
